server {
    listen 80;
    server_name localhost;

    # Direktori root tempat file statis aplikasi berada
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Coba layani file yang diminta secara langsung.
        # Jika tidak ditemukan, fallback ke index.html.
        # Ini penting untuk Single-Page Application (SPA) agar routing di sisi klien berfungsi.
        try_files $uri $uri/ /index.html;
    }

    # Tambahkan blok ini untuk meneruskan permintaan API ke backend
    location /api/ {
        # 'backend' adalah nama service dari docker-compose.yml
        # '8080' adalah port internal yang diekspos oleh service backend
        proxy_pass http://backend:8080/api/;

        # Header penting untuk meneruskan informasi koneksi asli
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}