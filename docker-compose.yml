version: "3.8"

services:
  # --- BACKEND SERVICE ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: si-bvet-backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DB_HOST=${DB_HOST:-postgres} # 'postgres' merujuk ke service di bawah jika local db digunakan
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRED_HOURS=${JWT_EXPIRED_HOURS:-5}

      # SMTP Configuration untuk Notifikasi Balai Veteriner
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_TIMEOUT_SECONDS=10
      - SMTP_MAX_RETRIES=3

      # Bootstrap Initial Superadmin (Hanya diisi saat pertama kali deploy)
      - BOOTSTRAP_SUPERADMIN_EMAIL=${BOOTSTRAP_SUPERADMIN_EMAIL}
      - BOOTSTRAP_SUPERADMIN_PASSWORD=${BOOTSTRAP_SUPERADMIN_PASSWORD}
      - BOOTSTRAP_SUPERADMIN_FULLNAME=${BOOTSTRAP_SUPERADMIN_FULLNAME}
      - BOOTSTRAP_SUPERADMIN_PHONE=${BOOTSTRAP_SUPERADMIN_PHONE}

      - APP_LOGIN_URL=${APP_LOGIN_URL}
    volumes:
      - backend-uploads:/app/uploads
      # Menyisipkan berkas kunci Akun Layanan GCP secara aman ke dalam kontainer
      - ./secrets:/app/secrets:ro
    depends_on:
      - postgres
    networks:
      - sibvet-network

  # --- DATABASE SERVICE (POSTGRESQL) ---
  # Kritik: Jika menggunakan Google Cloud SQL, service 'postgres' ini bisa dihapus dari file compose.
  postgres:
    image: postgres:15-alpine
    container_name: si-bvet-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sibvet-network

networks:
  sibvet-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-uploads:
    driver: local
