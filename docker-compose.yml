services:
  # --- FRONTEND SERVICE (NGINX) ---
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
      dockerfile: Dockerfile
    container_name: si-bvet-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - sibvet-network

  # --- BACKEND SERVICE ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: si-bvet-backend
    user: "${UPLOAD_UID:-1000}:${UPLOAD_GID:-1000}"
    deploy:
      resources:
        limits:
          memory: 1G
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - ./data/uploads:/app/uploads
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sibvet-network

  # --- DATABASE SERVICE (POSTGRESQL FOR LOCAL DEVELOPMENT) ---
  postgres:
    image: postgres:15-alpine
    container_name: si-bvet-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sibvet-network

networks:
  sibvet-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local