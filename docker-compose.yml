services:
  # --- FRONTEND SERVICE (NGINX) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: si-bvet-frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sibvet-network

  # --- BACKEND SERVICE ---
  backend:
    build:
      context: ./backend
      ssh:
        - default
      dockerfile: Dockerfile
    container_name: si-bvet-backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    env_file:
      - .env
    volumes:
      - backend-uploads:/app/uploads
      # Menyisipkan berkas kunci Akun Layanan GCP secara aman ke dalam kontainer
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Coba hubungi port 8080 di dalam kontainer backend
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sibvet-network

  # --- DATABASE SERVICE (POSTGRESQL for Local Development) ---
  # Catatan: Service 'postgres' ini hanya untuk pengembangan lokal.
  # Hapus atau nonaktifkan jika Anda menggunakan database eksternal seperti Google Cloud SQL.
  postgres:
    image: postgres:15-alpine
    container_name: si-bvet-postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sibvet-network

networks:
  sibvet-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  backend-uploads:
    driver: local
